<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>需求款式参考｜麦杞岐对接服务站</title><link rel="stylesheet" href="style.css"></head><body><div class="standalone-shell"><div class="standalone-head"><a class="back-link" href="index.html">← 返回服务站首页</a><div class="eyebrow">04 / REFERENCE</div><h1>需求款式参考</h1><p>衬衫与夹克外套分开管理，全部采用上下纵向排版，避免左右两栏挤压。后续增加/删除 PDF 只需修改 data/reference_pdfs.json。</p></div><div id="groups"></div></div><div class="footer-standalone"><b>仅作款式方向参考，不代表必须照搬。</b><span>PDF 内容来源于你提供的企划文件。</span></div><script>async function init(){const d=await fetch('data/reference_pdfs.json').then(r=>r.json());const groups=[['shirt','衬衫'],['jacket','夹克外套']];document.querySelector('#groups').innerHTML=groups.map(([cat,title])=>{const arr=d.items.filter(x=>x.category===cat);return `<section class="reference-group"><h2>${title}</h2><div class="reference-stack">${arr.map(x=>`<article class="pdf-card"><div class="pdf-title"><b>${x.title}</b><span>款式参考</span></div><iframe src="${x.pdf}" loading="lazy"></iframe><a href="${x.pdf}" target="_blank">打开完整 PDF →</a></article>`).join('')}</div></section>`}).join('')}init();</script></body></html>
