<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI指令与参考图库｜麦杞岐对接服务站</title><link rel="stylesheet" href="style.css"></head><body><div class="standalone-shell"><div class="standalone-head"><a class="back-link" href="visual.html">← 返回视觉优化</a><div class="eyebrow">AI PROMPTS</div><h1>AI指令与参考图库</h1><p>这里放你指定的参考图片 + 视觉风格 + AI 指令。商家可直接复制，内容通过 data/ai_prompts.json 独立维护。</p></div><div class="prompt-grid" id="list"></div></div><div class="footer-standalone"><b>提示：</b><span>生成后的图片请结合真实商品检查，避免商品变形、错误材质、错误颜色或虚假功能。</span></div><script>const $=s=>document.querySelector(s);async function init(){const d=await fetch('data/ai_prompts.json').then(r=>r.json());$('#list').innerHTML=d.items.map((x,i)=>`<article class="prompt-card"><img src="${x.image}" alt="${x.title}"><div class="prompt-card-body"><h3>${x.title}</h3><p><b>类目：</b>${x.category}　<b>风格：</b>${x.style}</p><p>${x.note||''}</p><div class="prompt-text" id="p${i}">${x.prompt}</div><button class="primary full" style="margin-top:10px" data-copy="p${i}">复制 AI 指令</button></div></article>`).join('');document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b)navigator.clipboard.writeText($('#'+b.dataset.copy).innerText).then(()=>{const old=b.innerText;b.innerText='已复制 ✓';setTimeout(()=>b.innerText=old,1000)})})}init();</script></body></html>
