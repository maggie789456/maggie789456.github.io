<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片优化中心｜麦杞岐对接服务站</title><link rel="stylesheet" href="style.css"></head><body><div class="standalone-shell"><div class="standalone-head"><a class="back-link" href="visual.html">← 返回视觉优化</a><div class="eyebrow">IMAGE OPTIMIZATION CENTER</div><h1>图片优化中心</h1><p>先保证商品本体不变，再优化背景、灯光、镜头、构图、模特和使用场景。</p></div><div class="visual-note"><b>使用原则：</b>商品版型、颜色、面料纹理、功能结构和真实细节优先保持准确；生成的 Prompt 仅作视觉创作建议，使用前请结合实际商品检查。</div><div class="tool-layout"><section><div class="tool-card"><h2>① 定义商品</h2><div class="field-grid"><div class="field"><label>商品大类</label><select id="category"></select></div><div class="field"><label>图片类型</label><select id="imageType"></select></div><div class="field"><label>视觉风格</label><select id="style"></select></div><div class="field"><label>背景</label><select id="background"></select></div><div class="field"><label>灯光</label><select id="lighting"></select></div><div class="field"><label>镜头</label><select id="camera"></select></div><div class="field"><label>构图</label><select id="composition"></select></div><div class="field"><label>模特类型</label><select id="model"></select></div><div class="field"><label>年龄段</label><select id="age"></select></div><div class="field"><label>姿势</label><select id="pose"></select></div></div><h3 style="margin-top:16px">AI希望完成什么</h3><div class="option-row" id="tasks"></div><div class="field" style="margin-top:14px"><label>补充商品信息</label><textarea id="productInfo">男士衬衫，具体填写颜色、版型、面料、领型、功能和商品特点。</textarea></div><div class="actions"><button class="primary" id="generate">✨ 生成优化 Prompt</button><button class="secondary" id="reset">↺ 重置</button></div></div></section><aside><div class="result-card2"><h2>② 可复制给 AI</h2><div class="prompt-box" id="prompt">请选择商品特征后点击“生成优化 Prompt”。</div><div class="actions"><button class="primary full" id="copy">📋 复制 Prompt</button></div></div></aside></div></div><script>let data={};let task='更换背景';const $=s=>document.querySelector(s);async function init(){data=await fetch('data/visual_tool_options.json').then(r=>r.json());[['category','categories'],['imageType','imageTypes'],['style','styles'],['background','backgrounds'],['lighting','lighting'],['camera','camera'],['composition','composition'],['model','model'],['age','age'],['pose','pose']].forEach(([id,k])=>$("#"+id).innerHTML=data[k].map((x,i)=>`<option>${x}</option>`).join(''));$('#tasks').innerHTML=data.tasks.map(x=>`<button class="option ${x===task?'active':''}" data-task="${x}">${x}</button>`).join('');document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{task=b.dataset.task;document.querySelectorAll('[data-task]').forEach(x=>x.classList.toggle('active',x===b))});$('#generate').onclick=generate;$('#reset').onclick=()=>{location.reload()};$('#copy').onclick=()=>navigator.clipboard.writeText($('#prompt').innerText).then(()=>$('#copy').innerText='已复制 ✓');}function val(id){return $('#'+id).value}function generate(){const p=`请基于我提供的原始商品图片进行视觉优化。\n\n【商品】${val('category')}；${$('#productInfo').value}\n【图片任务】${task}\n【图片类型】${val('imageType')}\n【视觉风格】${val('style')}\n【背景】${val('background')}\n【灯光】${val('lighting')}\n【镜头】${val('camera')}\n【构图】${val('composition')}\n【模特】${val('model')}，${val('age')}，${val('pose')}\n\n【核心要求】严格保持原商品的版型、颜色、面料纹理、纽扣/拉链、口袋、图案、比例及功能细节不变；不得凭空改变商品设计。画面真实自然，商业时装摄影质感，突出商品本身和穿着效果。不要新增品牌Logo、文字、水印或虚假功能。若原图存在细节不清，应优先保持原图信息，不要臆造。\n\n【输出】${val('imageType')}，画面干净、高级、适合商品展示。`;$('#prompt').textContent=p}init();</script></body></html>
