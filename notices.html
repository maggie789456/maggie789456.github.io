<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全部通知｜麦杞岐对接服务站</title><link rel="stylesheet" href="style.css"></head><body><div class="standalone-shell"><div class="standalone-head"><a class="back-link" href="index.html">← 返回服务站首页</a><div class="eyebrow">NOTICE CENTER</div><h1>全部通知</h1><p>首页只展示一行滚动式播报，点击这里查看完整通知。</p><div class="notice-filters" id="filters" style="margin-top:12px"></div></div><div class="notice-full"><div class="notice-full-list" id="list"></div></div></div><script>let notices=[];let filter=new URLSearchParams(location.search).get('type')||'全部';const $=s=>document.querySelector(s);async function init(){notices=(await fetch('data/notices.json').then(r=>r.json())).notices||[];render()}function render(){const types=['全部','热搜词','备货相关通知','提报通知','其他通知'];$('#filters').innerHTML=types.map(x=>`<button class="notice-filter ${filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('');const arr=notices.filter(x=>filter==='全部'||x.type===filter).sort((a,b)=>String(b.date).localeCompare(String(a.date)));$('#list').innerHTML=arr.map(n=>`<article class="notice-full-item"><span class="type ${n.level}">${n.type}</span><span>${n.date}</span><h4>${n.title}</h4><p>${n.content}</p></article>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()})}init();</script></body></html>
