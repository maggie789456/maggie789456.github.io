<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>最高优先款式｜麦杞岐对接服务站</title><link rel="stylesheet" href="style.css"></head><body><div class="standalone-shell"><div class="standalone-head"><a class="back-link" href="index.html">← 返回服务站首页</a><div class="eyebrow">05 / PRIORITY</div><h1>最高优先款式</h1><p>独立图片集合页。点击图片可放大查看；更新图片不会影响首页。新增图片只需上传图片 + 修改 data/priority_items.json。</p></div><div class="priority-tabs"><button class="priority-tab active" data-cat="shirt">衬衫</button><button class="priority-tab" data-cat="jacket">夹克外套</button></div><div class="priority-grid" id="grid"></div></div><div class="lightbox" id="lightbox"><button id="close">×</button><img id="lightImg" alt="款式大图"></div><script>let all=[];let cat='shirt';const $=s=>document.querySelector(s);async function init(){const d=await fetch('data/priority_items.json').then(r=>r.json());all=d.items||[];render();document.querySelectorAll('.priority-tab').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.priority-tab').forEach(x=>x.classList.toggle('active',x===b));render()});$('#close').onclick=close;$('#lightbox').onclick=e=>{if(e.target.id==='lightbox')close()};}function render(){const arr=all.filter(x=>x.category===cat).sort((a,b)=>String(b.addedAt).localeCompare(String(a.addedAt))||Number(b.sort)-Number(a.sort));$('#grid').innerHTML=arr.map(x=>`<article class="priority-card" data-img="${x.image}"><img src="${x.image}" alt="${x.title}" loading="lazy"><b>${x.title}</b><small>更新：${x.addedAt}</small></article>`).join('');document.querySelectorAll('.priority-card').forEach(c=>c.onclick=()=>{const img=c.dataset.img;$('#lightImg').src=img;$('#lightbox').classList.add('open')})}function close(){$('#lightbox').classList.remove('open')}init();</script></body></html>
